<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header Sidebar Main - Tailwind CSS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

  <div class="min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 p-5 text-white">
      <h1 class="text-2xl font-bold">
        Gestion des étudiants
      </h1>
    </header>

    <div class="flex">

      <!-- Sidebar -->
      <aside class="min-h-screen w-64 bg-slate-900 p-5 text-white">
        <h2 class="mb-5 font-bold">
          Menu
        </h2>

        <ul class="space-y-3">
          <li>Accueil</li>
          <li>Étudiants</li>
          <li>Notes</li>
        </ul>
      </aside>

      <!-- Main -->
        <!-- Main -->
    <main class="flex-1 p-8">

      <h2 class="text-3xl font-bold">
        Liste des étudiants
      </h2>

      <div class="mt-6 grid grid-cols-3 gap-5">

        <!-- StudentCard -->
        <div class="rounded-xl bg-white p-5 shadow">
          <h3 class="text-lg font-bold">
            Yassine
          </h3>

          <p class="mt-2 text-slate-500">
            Note : 14 / 20
          </p>
        </div>

        <!-- StudentCard -->
        <div class="rounded-xl bg-white p-5 shadow">
          <h3 class="text-lg font-bold">
            Youssef
          </h3>

          <p class="mt-2 text-slate-500">
            Note : 16 / 20
          </p>
        </div>

        <!-- StudentCard -->
        <div class="rounded-xl bg-white p-5 shadow">
          <h3 class="text-lg font-bold">
            Ghita
          </h3>

          <p class="mt-2 text-slate-500">
            Note : 18 / 20
          </p>
        </div>

      </div>

    </main>

    </div>

  </div>

</body>
</html>
